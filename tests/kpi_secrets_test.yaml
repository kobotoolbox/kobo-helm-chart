suite: kpi secret
templates:
- kpi/secrets.yaml
release:
  name: kobo
values:
- values/required.yaml
tests:
- it: renders django, enketo and datastore keys
  asserts:
  - equal:
      path: metadata.name
      value: kobo-kpi
  - equal:
      path: data.DJANGO_SECRET_KEY
      value: test-django-secret
      decodeBase64: true
  - equal:
      path: data.ENKETO_API_KEY
      value: test-enketo-api-key
      decodeBase64: true
  - equal:
      path: data.ENKETO_API_TOKEN
      value: test-enketo-api-key
      decodeBase64: true
  - equal:
      path: data.KC_DATABASE_URL
      value: postgis://kobo:pw@postgres:5432/kobocat
      decodeBase64: true
  - equal:
      path: data.MONGO_DB_URL
      value: mongodb://kobo:pw@mongo:27017/formhub
      decodeBase64: true
  - equal:
      path: data.DATABASE_URL
      value: postgres://kobo:pw@postgres:5432/koboform
      decodeBase64: true

- it: derives the redis URLs from kobotoolbox.redis
  set:
    kobotoolbox.redisParameters: "?ssl=true"
  asserts:
  - equal:
      path: data.ENKETO_REDIS_MAIN_URL
      value: redis://:pw@redis:6379/0?ssl=true
      decodeBase64: true
  - equal:
      path: data.REDIS_SESSION_URL
      value: redis://:pw@redis:6379/1?ssl=true
      decodeBase64: true
  - equal:
      path: data.CELERY_BROKER_URL
      value: redis://:pw@redis:6379/2?ssl=true
      decodeBase64: true
  - equal:
      path: data.CACHE_URL
      value: redis://:pw@redis:6379/4?ssl=true
      decodeBase64: true
  - equal:
      path: data.SERVICE_ACCOUNT_BACKEND_URL
      value: redis://:pw@redis:6379/6?ssl=true
      decodeBase64: true

- it: uses explicit session and service account redis URLs
  set:
    kobotoolbox.redis: ""
    kobotoolbox.redisSession: redis://:pw@cache:6379/2
    kobotoolbox.serviceAccountBackend: redis://:pw@cache:6379/6
  asserts:
  - equal:
      path: data.REDIS_SESSION_URL
      value: redis://:pw@cache:6379/2
      decodeBase64: true
  - equal:
      path: data.SERVICE_ACCOUNT_BACKEND_URL
      value: redis://:pw@cache:6379/6
      decodeBase64: true
  - notExists:
      path: data.CELERY_BROKER_URL

- it: fails without enketoApiKey
  set:
    kobotoolbox.enketoApiKey: ""
  asserts:
  - failedTemplate:
      errorPattern: kobotoolbox.enketoApiKey required
