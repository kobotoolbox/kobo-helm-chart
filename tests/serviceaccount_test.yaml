suite: service account
templates:
- serviceaccount.yaml
release:
  name: kobo
values:
- values/required.yaml
tests:
- it: creates the service account by default
  asserts:
  - isKind:
      of: ServiceAccount
  - equal:
      path: metadata.name
      value: kobo

- it: uses the configured name
  set:
    serviceAccount.name: icrc-kobo
  asserts:
  - equal:
      path: metadata.name
      value: icrc-kobo

- it: renders nothing when create is false
  set:
    serviceAccount.create: false
  asserts:
  - hasDocuments:
      count: 0
