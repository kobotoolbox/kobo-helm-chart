suite: existing secrets
templates:
- kpi/secrets.yaml
- enketo/secrets.yaml
- kpi/deployment.yaml
- kpi/deployment-beat.yaml
- kpi/deployment-worker.yaml
- kpi/deployment-worker-kobocat.yaml
- kpi/deployment-worker-long-running.yaml
- kpi/deployment-worker-low-priority.yaml
- kpi/kpi-metrics.yaml
- kpi/migration-job.yaml
- kpi/post-install-job.yaml
- enketo/deployment.yaml
- flower/deployment.yaml
# included by checksum annotations
- kpi/configmap.yaml
- enketo/configmap.yaml
release:
  name: kobo
values:
- values/required.yaml
set:
  postInstall.command: ./manage.py create_kobo_superuser
  kpi.metrics.enabled: true
  flower.enabled: true
tests:
- it: renders the chart Secrets by default
  templates:
  - kpi/secrets.yaml
  - enketo/secrets.yaml
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: Secret

- it: skips the chart Secrets when existing secrets are set
  set:
    kpi.existingSecret: my-kpi
    enketo.existingSecret: my-enketo
  templates:
  - kpi/secrets.yaml
  - enketo/secrets.yaml
  asserts:
  - hasDocuments:
      count: 0

- it: loads the existing kpi secret in every kpi pod
  set:
    kpi.existingSecret: my-kpi
  templates:
  - kpi/deployment.yaml
  - kpi/deployment-beat.yaml
  - kpi/deployment-worker.yaml
  - kpi/deployment-worker-kobocat.yaml
  - kpi/deployment-worker-long-running.yaml
  - kpi/deployment-worker-low-priority.yaml
  - kpi/migration-job.yaml
  - kpi/post-install-job.yaml
  - flower/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].envFrom
      content:
        secretRef:
          name: my-kpi

- it: reads kpi-metrics keys from the existing kpi secret
  set:
    kpi.existingSecret: my-kpi
  template: kpi/kpi-metrics.yaml
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      value: my-kpi
  - equal:
      path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
      value: my-kpi

- it: loads the existing enketo secret in the enketo pod
  set:
    enketo.existingSecret: my-enketo
  template: enketo/deployment.yaml
  asserts:
  - contains:
      path: spec.template.spec.containers[0].envFrom
      content:
        secretRef:
          name: my-enketo

- it: keeps the secret checksum by default
  templates:
  - kpi/deployment.yaml
  - kpi/deployment-beat.yaml
  - kpi/deployment-worker.yaml
  - kpi/deployment-worker-kobocat.yaml
  - kpi/deployment-worker-long-running.yaml
  - kpi/deployment-worker-low-priority.yaml
  - enketo/deployment.yaml
  - flower/deployment.yaml
  asserts:
  - exists:
      path: spec.template.metadata.annotations["checksum/secret"]

- it: drops the secret checksum when existing secrets are set
  set:
    kpi.existingSecret: my-kpi
    enketo.existingSecret: my-enketo
  templates:
  - kpi/deployment.yaml
  - kpi/deployment-beat.yaml
  - kpi/deployment-worker.yaml
  - kpi/deployment-worker-kobocat.yaml
  - kpi/deployment-worker-long-running.yaml
  - kpi/deployment-worker-low-priority.yaml
  - enketo/deployment.yaml
  - flower/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.metadata.annotations["checksum/secret"]

- it: drops the migration Job secret checksum when an existing kpi secret is set
  set:
    kpi.existingSecret: my-kpi
  template: kpi/migration-job.yaml
  asserts:
  - notExists:
      path: metadata.annotations["checksum/secret"]

- it: renders the Jobs without djangoSecret, enketoApiKey and DATABASE_URL when an existing kpi secret is set
  set:
    kpi.existingSecret: my-kpi
    enketo.existingSecret: my-enketo
    kobotoolbox.djangoSecret: ""
    kobotoolbox.enketoApiKey: ""
    kobotoolbox.kobocatDatabase: ""
    kpi.env.secret.DATABASE_URL: ""
  templates:
  - kpi/migration-job.yaml
  - kpi/post-install-job.yaml
  asserts:
  - notContains:
      path: spec.template.spec.containers[0].env
      any: true
      content:
        name: DJANGO_SECRET_KEY
  - notContains:
      path: spec.template.spec.containers[0].env
      any: true
      content:
        name: DATABASE_URL
  - notContains:
      path: spec.template.spec.containers[0].env
      any: true
      content:
        name: KC_DATABASE_URL

- it: still requires djangoSecret in the migration Job without an existing kpi secret
  set:
    kobotoolbox.djangoSecret: ""
    postInstall.command: ""
  template: kpi/migration-job.yaml
  asserts:
  - failedTemplate: {}

- it: still requires djangoSecret in the post-install Job without an existing kpi secret
  set:
    kobotoolbox.djangoSecret: ""
    migrationJob.enabled: false
  template: kpi/post-install-job.yaml
  asserts:
  - failedTemplate: {}
