suite: image pull secrets
templates:
- kpi/deployment.yaml
- kpi/deployment-beat.yaml
- kpi/deployment-worker.yaml
- kpi/deployment-worker-kobocat.yaml
- kpi/deployment-worker-long-running.yaml
- kpi/deployment-worker-low-priority.yaml
- kpi/kpi-metrics.yaml
- kpi/migration-job.yaml
- kpi/post-install-job.yaml
- enketo/deployment.yaml
- flower/deployment.yaml
# included by checksum annotations
- kpi/secrets.yaml
- kpi/configmap.yaml
- enketo/secrets.yaml
- enketo/configmap.yaml
release:
  name: kobo
values:
- values/required.yaml
set:
  postInstall.command: ./manage.py create_kobo_superuser
  kpi.metrics.enabled: true
  flower.enabled: true
tests:
- it: renders imagePullSecrets in every pod spec
  set:
    imagePullSecrets:
    - name: registry-secret
  templates:
  - kpi/deployment.yaml
  - kpi/deployment-beat.yaml
  - kpi/deployment-worker.yaml
  - kpi/deployment-worker-kobocat.yaml
  - kpi/deployment-worker-long-running.yaml
  - kpi/deployment-worker-low-priority.yaml
  - kpi/kpi-metrics.yaml
  - kpi/migration-job.yaml
  - kpi/post-install-job.yaml
  - enketo/deployment.yaml
  - flower/deployment.yaml
  asserts:
  - equal:
      path: spec.template.spec.imagePullSecrets
      value:
      - name: registry-secret

- it: renders no imagePullSecrets by default
  templates:
  - kpi/deployment.yaml
  - kpi/deployment-beat.yaml
  - kpi/deployment-worker.yaml
  - kpi/deployment-worker-kobocat.yaml
  - kpi/deployment-worker-long-running.yaml
  - kpi/deployment-worker-low-priority.yaml
  - kpi/kpi-metrics.yaml
  - kpi/migration-job.yaml
  - kpi/post-install-job.yaml
  - enketo/deployment.yaml
  - flower/deployment.yaml
  asserts:
  - notExists:
      path: spec.template.spec.imagePullSecrets
