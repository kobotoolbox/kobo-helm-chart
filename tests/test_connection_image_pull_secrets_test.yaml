suite: test connection image pull secrets
templates:
- tests/test-connection.yaml
release:
  name: kobo
values:
- values/required.yaml
tests:
- it: renders imagePullSecrets in the test pod
  set:
    imagePullSecrets:
    - name: registry-secret
  asserts:
  - equal:
      path: spec.imagePullSecrets
      value:
      - name: registry-secret
