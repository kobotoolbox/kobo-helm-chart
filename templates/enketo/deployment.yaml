apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kobo.fullname" . }}-enketo
  labels:
    app.kubernetes.io/component: enketo
    {{- include "kobo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.enketo.autoscaling.enabled }}
  replicas: {{ .Values.enketo.replicaCount }}
  {{- end }}
  {{- if .Values.enketo.strategy }}
  strategy: {{- toYaml .Values.enketo.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: enketo
      {{- include "kobo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/enketo/secrets.yaml") . | sha256sum }}
        checksum/configmap: {{ include (print $.Template.BasePath "/enketo/configmap.yaml") . | sha256sum }}
        tag: "{{ .Values.enketo.version }}"
        {{- if .Values.enketo.podAnnotations }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.enketo.podAnnotations "context" $ ) | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/component: enketo
        {{- include "kobo.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kobo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.enketo.image.repository }}:{{ required "enketo.version required" .Values.enketo.version }}"
          imagePullPolicy: {{ .Values.enketo.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8005
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /connection
              port: 8005
            initialDelaySeconds: 3
          readinessProbe:
            httpGet:
              path: /connection
              port: 8005
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.enketo.resources | nindent 12 }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "kobo.redis.fullname" .) .Values.redis.auth.existingSecret }}
                  key: redis-password
            - name: ENKETO_REDIS_MAIN_URL
              value: {{ (include "kobo.redis.url" .) }}
            - name: ENKETO_REDIS_CACHE_URL 
              value: {{ (include "kobo.redis.url" .) }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "kobo.fullname" . }}-enketo
            - configMapRef:
                name: {{ include "kobo.fullname" . }}-enketo
          {{- with .Values.enketo.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 10 }}
          {{- end }}
        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 100m
              memory: 250Mi
            requests:
              cpu: 1m
              memory: 32Mi
          volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d/
          {{- if .Values.kpi.nginx.ssl.enabled }}
          - name: nginx-ssl
            mountPath: /etc/nginx/ssl
            readOnly: true
          {{- end }}
          ports:
            {{- if .Values.kpi.nginx.ssl.enabled }}
            - containerPort: 443
            {{- else }}
            - containerPort: 80
            {{- end }}
      {{- with .Values.enketo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.enketo.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.enketo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: enketo
      volumes:
      - name: nginx-conf
        configMap:
          name: {{ include "kobo.fullname" . }}-nginx-enketo-conf
      {{- if .Values.kpi.nginx.ssl.enabled }}
      - name: nginx-ssl
        secret:
          secretName: {{ required "kpi.nginx.ssl.certSecret is required when tls is enabled" .Values.kpi.nginx.ssl.certSecret }}
      {{- end }}
      {{- with .Values.enketo.extraVolumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
