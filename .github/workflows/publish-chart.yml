name: publish-chart

on:
  push:
    branches:
      - main
  # trigger manually from gh ui
  workflow_dispatch:

concurrency:
  group: publish-chart
  cancel-in-progress: false

jobs:
  publish_chart:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: alexellis/arkade-get@master
        with:
          helm: ${{ vars.HELM_VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: Read chart version
        id: version
        run: |
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          echo "CHART_VERSION=${CHART_VERSION}" >> $GITHUB_ENV
          # fixed-string match so a prerelease like 7.0.0-dev-env doesn't count as 7.0.0
          TAGS=$(oras repo tags ghcr.io/kobotoolbox/kobo)
          if grep -qxF "${CHART_VERSION}" <<< "${TAGS}"; then
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Package and push chart
        if: steps.version.outputs.published != 'true'
        run: |
          helm package -d chart .

          OWNER_LOWER_CASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]') #repo must be lowercase

          # Push the chart using OCI
          # This will call the package 'kobo' for now but it may make sense in the future to change it to `kobo-helm-chart` in Chart.yaml
          helm push chart/kobo-${CHART_VERSION}.tgz oci://ghcr.io/${OWNER_LOWER_CASE}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # checked separately from the chart so a re-run still creates the release if only that failed
          if gh release view "${CHART_VERSION}" > /dev/null 2>&1; then
            echo "Release ${CHART_VERSION} already exists, skipping"
            exit 0
          fi

          # Versions with a suffix like 7.0.0-dev-env are prereleases
          PRERELEASE=""
          if [[ "${CHART_VERSION}" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          # Notes are everything under the matching "# <version>" heading in CHANGELOG.md, up to the next one.
          # Empty if there's no matching section
          awk -v v="${CHART_VERSION}" '/^# /{p = ($2 == v); next} p' CHANGELOG.md > release-notes.md

          # Creates the tag on this commit
          gh release create "${CHART_VERSION}" --target "${GITHUB_SHA}" --title "${CHART_VERSION}" --notes-file release-notes.md ${PRERELEASE}
